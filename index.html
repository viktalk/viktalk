<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VikTalk - Connect & Chat</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #fffaf3;
    color: #493426;
}

header {
    background: white;
    padding: 18px;
    text-align: center;
    border-bottom: 2px solid #ead8c5;
}

.logo {
    font-size: 30px;
    font-weight: bold;
    color: #70452c;
}

.logo span {
    color: #b8895e;
}

.container {
    max-width: 420px;
    margin: 30px auto;
    padding: 25px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 18px #00000012;
}

h1, h2 {
    text-align: center;
    margin-bottom: 15px;
    color: #70452c;
}

.subtitle {
    text-align: center;
    margin-bottom: 25px;
    color: #8b7665;
}

label {
    display: block;
    margin: 12px 0 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #d8c2ad;
    border-radius: 8px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 18px;
    border: none;
    border-radius: 8px;
    background: #70452c;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #57351f;
}

.links {
    text-align: center;
    margin-top: 18px;
    line-height: 2;
}

a {
    color: #98663e;
    text-decoration: none;
    font-weight: bold;
    cursor: pointer;
}

.hidden {
    display: none;
}

.notice {
    margin-top: 18px;
    padding: 12px;
    background: #fff4e5;
    border-radius: 8px;
    font-size: 13px;
    text-align: center;
    color: #75563e;
}

.features {
    max-width: 850px;
    margin: 25px auto;
    padding: 15px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
}

.feature {
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 3px 12px #0000000d;
}

footer {
    text-align: center;
    padding: 25px;
    color: #8b7665;
    font-size: 13px;
}
</style>
</head>

<body>

<header>
    <div class="logo"><span>V+</span> VikTalk</div>
</header>

<div class="container" id="loginBox">

    <h1>Welcome to VikTalk</h1>
    <p class="subtitle">Connect, Chat & Make Friends</p>

    <form onsubmit="login(event)">
        <label>Username or Mobile Number</label>
        <input type="text" id="loginUser" placeholder="Enter username or mobile" required>

        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password" required>

        <button type="submit">Login</button>
    </form>

    <div class="links">
        <a onclick="forgotPassword()">Forgot Password?</a>
        <br>
        Don't have an account?
        <a onclick="showRegister()">Create New Account</a>
    </div>

    <div class="notice">
        18+ Safe and Private Community
    </div>
</div>

<div class="container hidden" id="registerBox">

    <h2>Create Your Account</h2>
    <p class="subtitle">Join the VikTalk Community</p>

    <form onsubmit="register(event)">

        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="Enter your full name" required>

        <label>Mobile Number</label>
        <input type="tel" id="mobile" maxlength="10"
        pattern="[0-9]{10}" placeholder="Enter 10 digit mobile number" required>

        <label>Date of Birth</label>
        <input type="date" id="dob" required>

        <label>Create Password</label>
        <input type="password" id="newPassword" placeholder="Create password" required>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password" required>

        <button type="submit">Create Account</button>

    </form>

    <div class="links">
        Already have an account?
        <a onclick="showLogin()">Login</a>
    </div>

    <div class="notice">
        You must be 18 years or older to
 register.</div>
</div>

<script>
function showRegister() {
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("registerBox").classList.remove("hidden");
}

function showLogin() {
  document.getElementById("registerBox").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
}

function forgotPassword() {
  alert("Password recovery by mobile OTP will be available soon.");
}

function login(event) {
  event.preventDefault();

  const username = document.getElementById("loginUser").value.trim();
  const password = document.getElementById("loginPassword").value;

  if (!username || !password) {
    alert("Please enter username and password.");
    return;
  }

  alert("Login system is not connected yet. Backend setup is required.");
}

function register(event) {
  event.preventDefault();

  const name = document.getElementById("fullName").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const dob = document.getElementById("dob").value;
  const password = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (!name || !mobile || !dob || !password || !confirmPassword) {
    alert("Please fill in all details.");
    return;
  }

  if (!/^[0-9]{10}$/.test(mobile)) {
    alert("Please enter a valid 10 digit mobile number.");
    return;
  }

  const birthDate = new Date(dob);
  const today = new Date();

  let age = today.getFullYear() - birthDate.getFullYear();
  const month = today.getMonth() - birthDate.getMonth();

  if (month < 0 || (month === 0 && today.getDate() < birthDate.getDate())) {
    age--;
  }

  if (age < 18) {
    alert("You must be 18 years or older to register.");
    return;
  }

  if (password.length < 6) {
    alert("Password must be at least 6 characters.");
    return;
  }

  if (password !== confirmPassword) {
    alert("Passwords do not match.");
    return;
  }

  alert("Your details are valid. Account creation will work after backend and OTP setup.");
}
</script>

</body>
</html>
